# main compose file for Prometheus, Grafana, and Telegraf, all on the observability Docker network.

version: "3.9"

networks:
  observability:
    external: true   # created with: docker network create observability

volumes:
  grafana_data:
  prometheus_data:

services:
  # ---------------- Prometheus ----------------
  prometheus:
    image: prom/prometheus:v3.9.1@sha256:1f0f50f06acaceb0f5670d2c8a658a599affe7b0d8e78b898c1035653849a702
    container_name: prometheus
    networks:
      - observability
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped

  # ---------------- Grafana ----------------
  grafana:
    image: grafana/grafana:13.0.2@sha256:5dad0df181cb644a14e13617b913b261a54f7d4fd4510721dba420929f35bea2
    container_name: grafana
    networks:
      - observability
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      # (Optional) If you add provisioning later:
      # - ./grafana/provisioning:/etc/grafana/provisioning
    restart: unless-stopped

  # ---------------- Telegraf ----------------
  telegraf:
    image: telegraf:1.30.3@sha256:a05b4b4ce2678bfc94e6ccfcbaebc4ce1d30906c1d93ee6595522e5519dc31a6
    container_name: telegraf
    networks:
      - observability
    ports:
      - "9273:9273"      # Prometheus scrapes this
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    restart: unless-stopped
